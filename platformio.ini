; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Builds the sketch in Dev/StateMachineFirmware for each state machine model:
;   pio run                     (all models)
;   pio run -e <environment>    (one model)
;
; WARNING: always name the environment when uploading:
;   pio run -e <environment> -t upload
; Without -e, every environment is uploaded in turn, which leaves firmware for
; a different state machine model on the connected board.
;
; The hardware setup macros of the sketch are set here via build flags.

[platformio]
description = Bpod State Machine firmware
src_dir = Dev/StateMachineFirmware

[env]
framework = arduino
extra_scripts = post:Tools/copy_firmware.py

[teensy]
platform = teensy@~5.1.0
build_flags = -D SM_FEATURE_PROFILE=1

[due]
platform = atmelsam@~9.0.0
; GCC 4.8, close to the compiler of the Arduino IDE's Due core (4.8.3)
platform_packages = toolchain-gccarmnoneeabi@~1.40804.0
board = dueUSB
; The firmware needs 50 kHz PWM. The Due core defines its PWM frequencies
; unconditionally, so they are overridden by a force-included header.
build_flags =
    -include Tools/due_pwm_override.h
    -D SM_FEATURE_PROFILE=0

; FSM 0.5 (Arduino Due)
[env:fsm0_5]
extends = due
build_flags = ${due.build_flags} -D MACHINE_TYPE=1 -D MACHINE_BUILD=0
custom_firmware_name = StateMachine_Bpod05

; FSM 0.7-1.0 (Arduino Due)
[env:fsm1_0]
extends = due
build_flags = ${due.build_flags} -D MACHINE_TYPE=2 -D MACHINE_BUILD=0
custom_firmware_name = StateMachine_Bpod1

; FSM 2.0-2.4 (Teensy 3.6)
[env:fsm2_0]
extends = teensy
board = teensy36
build_flags = ${teensy.build_flags} -D USB_DUAL_SERIAL -D MACHINE_TYPE=3 -D MACHINE_BUILD=0
custom_firmware_name = StateMachine_Bpod2

; FSM 2.5 (Teensy 4.1)
[env:fsm2_5]
extends = teensy
board = teensy41
build_flags = ${teensy.build_flags} -D USB_DUAL_SERIAL -D MACHINE_TYPE=3 -D MACHINE_BUILD=1
custom_firmware_name = StateMachine_Bpod2_5

; FSM 2+ r1.0 (Teensy 4.1)
[env:fsm2plus]
extends = teensy
board = teensy41
build_flags = ${teensy.build_flags} -D USB_TRIPLE_SERIAL -D MACHINE_TYPE=4 -D MACHINE_BUILD=0
custom_firmware_name = StateMachine_Bpod2Plus
